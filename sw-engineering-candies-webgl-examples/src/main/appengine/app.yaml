runtime: custom
env: flex

# Run exactly one instance
manual_scaling:
  instances: 1

# Health checks
liveness_check:
  path: "/smoke"
  check_interval_sec: 30
  timeout_sec: 10
  failure_threshold: 5

readiness_check:
  path: "/smoke"
  check_interval_sec: 10
  timeout_sec: 10
  failure_threshold: 5
  app_start_timeout_sec: 600
